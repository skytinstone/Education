<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Eureka | AI 시험 에이전트</title>
<link rel="manifest" href="/app/manifest.webmanifest" />
<meta name="theme-color" content="#f7f8fb" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Eureka" />
<link rel="apple-touch-icon" href="/app/icons/icon-180.png" />
<link rel="icon" type="image/svg+xml" href="/app/icons/favicon.svg" />
<link rel="icon" type="image/png" sizes="32x32" href="/app/icons/favicon-32.png" />
<link rel="icon" type="image/png" sizes="192x192" href="/app/icons/icon-192.png" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
<!-- Horcrux Technologies 로고 폰트 (회사 웹사이트 --font-heading 과 동일) -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&display=swap" />
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script src="dots.js"></script>
<!-- 수식 렌더링 (문제·보기·해설의 $…$ LaTeX) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<link rel="stylesheet" href="app.css" />
<style>
  :root {
    --bg: #f7f8fb;
    --ink: #0f172a;
    --ink-2: #475569;
    --ink-3: #6b7280; /* 흰 배경 대비 4.8:1 (AA) */
    --line: rgba(15, 23, 42, 0.08);
    --accent: #4f6bff;
    --accent-soft: rgba(79, 107, 255, 0.1);
    --warn: #f97316;

    /* 과목 색 — 무지개 스펙트럼에서 추출, 과목 표시에만 사용 */
    --math: #3b82f6;
    --physics: #8b5cf6;
    --chemistry: #14b8a6;
    --biology: #22c55e;
    --earth: #f59e0b;

    --rainbow: conic-gradient(from 0deg, #ff5f6d, #ffb347, #ffe259, #5ee7a0, #4fc3ff, #6b7cff, #c06bff, #ff5f6d);

    /* Liquid Glass — Clear (내비게이션 층에만) */
    --glass: rgba(255, 255, 255, 0.42);
    --glass-strong: rgba(255, 255, 255, 0.7);
    --glass-hover: rgba(255, 255, 255, 0.6);
    --glass-blur: blur(24px) saturate(170%);
    --glass-shadow: 0 8px 32px rgba(31, 41, 80, 0.07);
    --surface: rgba(255, 255, 255, 0.92);

    --radius-lg: 20px;
    --sidebar-w: 256px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    color: var(--ink);
    background: var(--bg);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  input { font: inherit; color: inherit; }
  [data-lucide] { width: 16px; height: 16px; stroke-width: 1.6; flex-shrink: 0; }

  /* ---------- 무지개 도트 배경 ---------- */
  #dots { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }

  /* 유리: 위는 밝고 아래는 흐린 그라디언트 테두리로 빛이 맺힌 느낌 */
  .glass {
    position: relative;
    background: var(--glass);
    backdrop-filter: var(--glass-blur);
    -webkit-backdrop-filter: var(--glass-blur);
    box-shadow: var(--glass-shadow), inset 0 1px 0 rgba(255, 255, 255, 0.85);
  }
  .glass::before {
    content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px; pointer-events: none;
    background: linear-gradient(180deg, rgba(255,255,255,.95), rgba(255,255,255,.35) 40%, rgba(15,23,42,.06));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude;
  }

  .app { position: relative; z-index: 1; display: flex; height: 100vh; padding: 12px; gap: 12px; }

  /* ---------- 사이드바 ---------- */
  .sidebar {
    width: var(--sidebar-w); flex-shrink: 0;
    border-radius: var(--radius-lg);
    display: flex; flex-direction: column;
    padding: 16px 10px 10px;
    transition: margin-left .35s cubic-bezier(.2,.8,.2,1), opacity .25s;
  }
  .app.collapsed .sidebar { margin-left: calc(-1 * var(--sidebar-w) - 12px); opacity: 0; }

  /* 회사 로고명 | 서비스명 */
  .brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 18px; white-space: nowrap; }
  .brand-company { font-family: "Space Grotesk", sans-serif; font-weight: 700; font-size: 14px; letter-spacing: -0.025em; color: var(--ink); }
  .brand-divider { width: 1px; height: 14px; background: rgba(15, 23, 42, 0.18); }
  .brand-name { font-weight: 700; font-size: 17px; letter-spacing: -0.02em; }

  .nav-item {
    display: flex; align-items: center; gap: 10px;
    width: 100%; padding: 9px 10px; border-radius: 10px;
    font-size: 14px; line-height: 18px; color: var(--ink); text-align: left;
    transition: background .15s;
  }
  .nav-item:hover { background: var(--glass-hover); }
  .nav-item.active {
    background: rgba(255, 255, 255, 0.78); font-weight: 600;
    box-shadow: inset 0 1px 0 #fff, inset 0 0 0 1px rgba(255,255,255,.6), 0 1px 2px rgba(15,23,42,.04), 0 4px 14px rgba(15,23,42,.05);
  }
  .nav-item [data-lucide] { color: var(--ink-2); }
  .nav-item kbd { margin-left: auto; }
  .nav-item .label { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .badge {
    font-size: 11px; font-weight: 700; color: #fff; background: var(--warn);
    min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px;
    display: grid; place-items: center;
  }
  .dday { font-size: 11px; font-weight: 600; color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .dday.soon { color: var(--warn); }

  /* 목록이 스크롤될 때 위아래 끝이 페이드 아웃 */
  .nav-scroll {
    flex: 1; overflow-y: auto; margin: 0 -4px; padding: 0 4px 16px; scrollbar-width: none;
    -webkit-mask-image: linear-gradient(180deg, transparent 0, #000 14px, #000 calc(100% - 28px), transparent 100%);
    mask-image: linear-gradient(180deg, transparent 0, #000 14px, #000 calc(100% - 28px), transparent 100%);
  }
  .nav-scroll::-webkit-scrollbar { display: none; }
  .section-title {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 13px; font-weight: 500; color: var(--ink-3);
    padding: 16px 10px 6px;
  }
  .section-title button { color: var(--ink-3); padding: 2px; border-radius: 6px; display: grid; }
  .section-title button:hover { color: var(--ink); background: var(--glass-hover); }
  .nav-item.chat { font-size: 13.5px; color: var(--ink-2); padding: 7px 10px; }
  .nav-item.chat:hover { color: var(--ink); }

  .profile {
    display: flex; align-items: center; gap: 10px;
    margin-top: 4px; padding: 8px 6px 8px 10px; border-radius: 14px;
  }
  .avatar {
    width: 28px; height: 28px; border-radius: 50%; background: var(--rainbow);
    display: grid; place-items: center; font-size: 12px; font-weight: 700; color: #fff;
    text-shadow: 0 1px 2px rgba(0,0,0,.25);
  }
  .profile .who { flex: 1; min-width: 0; font-size: 13px; line-height: 1.3; }
  .profile .who small { display: block; color: var(--ink-3); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ---------- 메인 ---------- */
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative; }

  /* 상단바: 콘텐츠 위에 떠 있고, 뒤의 흐림 띠가 아래로 갈수록 투명해져 경계 없이 사라진다 */
  .topbar {
    position: absolute; top: 0; left: 0; right: 0; z-index: 5;
    display: flex; align-items: center; gap: 8px; padding: 0 4px 0 2px; height: 48px;
  }
  .topbar::before {
    content: ""; position: absolute; left: -12px; right: -12px; top: -12px; bottom: -28px; z-index: -1;
    background: linear-gradient(180deg, var(--bg) 0%, rgba(247, 248, 251, 0.82) 45%, rgba(247, 248, 251, 0) 100%);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    -webkit-mask-image: linear-gradient(180deg, #000 45%, transparent);
    mask-image: linear-gradient(180deg, #000 45%, transparent);
    opacity: .7; transition: opacity .3s;
  }
  .topbar.scrolled::before { opacity: 1; }

  .icon-btn { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 9px; transition: background .15s; position: relative; }
  .icon-btn:hover { background: rgba(15,23,42,.05); }

  /* 검색·버튼: 테두리 없는 유리 알약 */
  .soft {
    background: rgba(255, 255, 255, 0.55);
    backdrop-filter: blur(16px) saturate(160%); -webkit-backdrop-filter: blur(16px) saturate(160%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.9), inset 0 0 0 1px rgba(255,255,255,.5), 0 1px 2px rgba(15,23,42,.04), 0 4px 14px rgba(15,23,42,.04);
    transition: background .25s, box-shadow .25s, width .35s cubic-bezier(.16,1,.3,1);
  }
  .soft:hover { background: rgba(255, 255, 255, 0.75); }
  .search {
    margin: 0 auto; width: min(280px, 30vw); height: 34px;
    display: flex; align-items: center; gap: 8px;
    padding: 0 10px 0 13px; border-radius: 999px;
    color: var(--ink-3); font-size: 13.5px; cursor: text;
  }
  .search:focus-within {
    width: min(380px, 40vw); background: rgba(255,255,255,.92);
    box-shadow: inset 0 1px 0 #fff, 0 0 0 4px var(--accent-soft), 0 8px 24px rgba(15,23,42,.08);
  }
  .search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--ink); }
  .search input::placeholder { color: var(--ink-3); transition: opacity .2s; }
  .search:focus-within input::placeholder { opacity: .6; }
  kbd { font-family: inherit; font-size: 10.5px; color: var(--ink-3); min-width: 18px; height: 18px; display: grid; place-items: center; border-radius: 5px; background: rgba(15,23,42,.05); }
  .pill-btn { height: 34px; padding: 0 14px; border-radius: 999px; font-size: 13.5px; font-weight: 500; }
  .topbar .icon-btn.soft { width: 34px; height: 34px; border-radius: 50%; }
  .dot[hidden] { display: none; }
  .dot { position: absolute; top: 7px; right: 8px; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); border: 1.5px solid #fff; }

  /* 스크롤 영역을 .app 안쪽 여백(12px)만큼 오른쪽·아래로 넓혀 스크롤바가 화면 가장자리에 붙게 하고,
     넓힌 만큼 padding 을 더해 내용 위치는 그대로 둔다. 스크롤바는 스크롤할 때만(.is-scrolling) 보인다 */
  .content {
    --edge: 12px;
    flex: 1; overflow-y: auto;
    margin: 0 calc(-1 * var(--edge)) calc(-1 * var(--edge)) 0;
    padding: 48px calc(4px + var(--edge)) calc(40px + var(--edge)) 4px;
    scrollbar-width: thin; scrollbar-color: transparent transparent;
    transition: scrollbar-color .3s;
  }
  .content.is-scrolling { scrollbar-color: rgba(20,24,40,.28) transparent; }
  .content::-webkit-scrollbar { width: 8px; }
  .content::-webkit-scrollbar-track { background: transparent; }
  .content::-webkit-scrollbar-thumb { background: transparent; border-radius: 8px; }
  .content.is-scrolling::-webkit-scrollbar-thumb { background: rgba(20,24,40,.28); }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 20px; }

  .hero { text-align: center; padding: 9vh 0 0; }
  .hero h1 { font-size: clamp(24px, 2.4vw, 30px); font-weight: 600; letter-spacing: -0.025em; }
  .hero p { color: var(--ink-2); margin-top: 8px; font-size: 14px; }

  /* 입력창 = 화면의 주인공 */
  .composer {
    margin: 24px auto 0; max-width: 650px;
    border-radius: 28px; padding: 7px 7px 7px 10px;
    display: flex; align-items: center; gap: 6px;
    background: rgba(255,255,255,.55);
    box-shadow: 0 12px 40px rgba(31,41,80,.1), inset 0 1px 0 #fff;
  }
  .composer input { flex: 1; border: 0; outline: 0; background: transparent; font-size: 15px; padding: 8px 4px; min-width: 0; }
  .composer input::placeholder { color: var(--ink-3); }
  .composer .icon-btn:hover { background: rgba(255,255,255,.7); }
  .chip {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 4px 9px; border-radius: 999px; font-size: 12.5px; font-weight: 600;
    background: color-mix(in srgb, var(--c, var(--accent)) 12%, transparent); color: var(--c, var(--accent)); white-space: nowrap;
  }
  .chip [data-lucide] { width: 13px; height: 13px; }
  .send {
    width: 36px; height: 36px; border-radius: 50%;
    background: var(--ink); color: #fff; display: grid; place-items: center;
    transition: transform .15s, opacity .15s, box-shadow .3s;
  }
  .send:disabled { opacity: .2; cursor: default; }
  .send:not(:disabled) { box-shadow: 0 0 0 3px #fff, 0 0 0 5px transparent; }
  .send:not(:disabled):hover { transform: scale(1.05); }

  .actions { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; max-width: 460px; margin: 64px auto 0; }
  .action { display: flex; flex-direction: column; align-items: center; gap: 11px; padding: 6px 0; border-radius: 14px; font-size: 14px; font-weight: 500; }
  .action .tile {
    width: 42px; height: 42px; border-radius: 11px; display: grid; place-items: center;
    border: 1px solid transparent;
    background: linear-gradient(#fff, #fff) padding-box, linear-gradient(var(--line), var(--line)) border-box;
    box-shadow: 0 1px 3px rgba(15,23,42,.05);
    transition: transform .2s, background .2s;
  }
  .action .tile [data-lucide] { width: 17px; height: 17px; }
  /* 호버 시 무지개 테두리 */
  .action:hover .tile { transform: translateY(-3px); background: linear-gradient(#fff, #fff) padding-box, var(--rainbow) border-box; }

  .btn-primary { background: var(--ink); color: #fff; height: 32px; padding: 0 13px; border-radius: 9px; font-weight: 500; font-size: 14px; }
  .btn-primary:hover { background: #1e293b; }
  .btn-ghost { height: 32px; padding: 0 13px; border-radius: 9px; font-weight: 500; font-size: 14px; background: rgba(255,255,255,.7); border: 1px solid var(--line); }
  .btn-ghost:hover { background: #fff; }

  /* ---------- 홈 대시보드: 오늘 · 학습 기록 ---------- */
  .panel {
    background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
    padding: 18px 20px; box-shadow: 0 2px 10px rgba(31,41,80,.04); min-width: 0;
  }
  .panel-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .panel-head h2, .panel h2 { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
  .muted { font-size: 12.5px; color: var(--ink-3); }

  .today { display: grid; grid-template-columns: 1fr 1.55fr 1fr; gap: 14px; margin-top: 56px; align-items: stretch; }

  .goal { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 12px; }
  .goal h2 { align-self: flex-start; }
  .ring { position: relative; width: 120px; height: 120px; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 10; }
  .ring .track { stroke: rgba(15,23,42,.06); }
  .ring .fill { stroke: url(#ring-grad); stroke-linecap: round; transition: stroke-dashoffset 1.2s cubic-bezier(.16,1,.3,1); }
  .ring .num { position: absolute; inset: 0; display: grid; place-content: center; line-height: 1.1; }
  .ring .num b { font-size: 28px; font-weight: 700; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
  .ring .num small { font-size: 12px; color: var(--ink-3); }
  .goal .msg { font-size: 13.5px; font-weight: 600; }
  .goal .msg.done { color: var(--ok); }
  .streak { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; color: var(--ink-2); }
  .streak [data-lucide] { width: 14px; height: 14px; color: var(--warn); }
  .streak.off [data-lucide] { color: var(--ink-3); }

  .todo-list { display: flex; flex-direction: column; gap: 4px; margin-top: 10px; }
  .todo-item {
    display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
    padding: 10px; margin: 0 -10px; width: calc(100% + 20px); border-radius: 12px;
    color: inherit; text-decoration: none; transition: background .15s;
  }
  .todo-item:hover { background: rgba(15,23,42,.035); }
  .todo-item .ic {
    width: 34px; height: 34px; border-radius: 10px; flex-shrink: 0; display: grid; place-items: center;
    background: color-mix(in srgb, var(--c) 12%, transparent); color: var(--c);
  }
  .todo-item .tx { flex: 1; min-width: 0; }
  .todo-item b { display: block; font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .todo-item small { display: block; font-size: 12.5px; color: var(--ink-3); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .todo-item .go { color: var(--ink-3); transition: transform .2s; }
  .todo-item:hover .go { transform: translateX(3px); color: var(--ink); }
  .todo-done { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 28px 0 18px; text-align: center; font-size: 13.5px; color: var(--ink-2); }
  .todo-done [data-lucide] { width: 26px; height: 26px; color: var(--ok); }

  .exam { display: flex; flex-direction: column; gap: 6px; color: inherit; text-decoration: none; }
  a.exam { transition: transform .2s, box-shadow .2s; }
  a.exam:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(31,41,80,.08); }
  .exam .dd { margin-top: 10px; font-size: 40px; line-height: 1; font-weight: 800; letter-spacing: -0.04em; color: var(--c); font-variant-numeric: tabular-nums; }
  .exam .name { font-size: 14.5px; font-weight: 600; margin-top: 6px; }
  .exam .date { font-size: 12.5px; color: var(--ink-3); }
  .exam .facts { display: flex; gap: 14px; margin-top: auto; padding-top: 12px; font-size: 12.5px; color: var(--ink-2); }
  .exam .facts b { font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; }
  .exam .next { font-size: 12px; color: var(--ink-3); border-top: 1px solid var(--line); padding-top: 8px; margin-top: 8px; }
  .exam.empty-exam { align-items: flex-start; }
  .exam.empty-exam p { font-size: 13.5px; color: var(--ink-2); line-height: 1.6; margin: 10px 0 14px; }

  .activity { margin-top: 14px; }
  .legend { display: inline-flex; align-items: center; gap: 3px; font-size: 11.5px; color: var(--ink-3); }
  .legend i { width: 11px; height: 11px; border-radius: 3px; }
  .legend i:first-child { margin-left: 3px; }
  .legend i:last-child { margin-right: 3px; }
  .l0 { background: rgba(15,23,42,.06); }
  .l1 { background: color-mix(in srgb, var(--accent) 25%, transparent); }
  .l2 { background: color-mix(in srgb, var(--accent) 45%, transparent); }
  .l3 { background: color-mix(in srgb, var(--accent) 70%, transparent); }
  .l4 { background: var(--accent); }
  .activity-body { display: flex; gap: 28px; align-items: flex-end; margin-top: 14px; }
  .heat-scroll { flex: 1; min-width: 0; overflow: hidden; display: flex; justify-content: flex-end; }
  .heat { display: inline-grid; grid-auto-flow: column; grid-auto-columns: 12px; grid-template-rows: 14px repeat(7, 12px); gap: 3px; }
  .heat .m { font-size: 10.5px; color: var(--ink-3); white-space: nowrap; line-height: 12px; width: 12px; overflow: visible; }
  .heat .d { width: 12px; height: 12px; border-radius: 3px; }
  .heat .d.is-today { box-shadow: inset 0 0 0 1.5px var(--accent); }
  .heat .d.future { visibility: hidden; }
  .week-stats { display: grid; grid-template-columns: repeat(3, auto); gap: 6px 24px; flex-shrink: 0; }
  .wstat .k { font-size: 12px; color: var(--ink-3); }
  .wstat .v { font-size: 22px; font-weight: 700; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .wstat .v small { font-size: 12.5px; font-weight: 500; color: var(--ink-3); margin-left: 2px; }
  .wstat .delta { font-size: 12px; font-weight: 600; color: var(--ink-3); }
  .wstat .delta.up { color: var(--ok); }
  .wstat .delta.down { color: var(--bad); }

  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; margin-top: 16px; }
  .card {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 14px; padding: 16px; text-align: left;
    box-shadow: 0 2px 10px rgba(31,41,80,.04);
    transition: transform .2s, box-shadow .2s;
    display: flex; flex-direction: column; gap: 8px;
  }
  .card:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(31,41,80,.08); }
  .card .kind { font-size: 12px; color: var(--ink-3); display: flex; align-items: center; gap: 6px; }
  .card .kind .sw { width: 7px; height: 7px; border-radius: 50%; background: var(--c, var(--ink-3)); }
  .card h3 { font-size: 14.5px; font-weight: 600; letter-spacing: -0.01em; }
  .card .meta { font-size: 12.5px; color: var(--ink-2); }
  .bar { height: 5px; border-radius: 3px; background: rgba(15,23,42,.06); overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 3px; background: var(--c, var(--accent)); }

  .section-head { display: flex; align-items: baseline; justify-content: space-between; margin-top: 44px; }
  .section-head h2 { font-size: 16px; font-weight: 600; letter-spacing: -0.01em; }
  .section-head a { font-size: 13px; color: var(--ink-3); text-decoration: none; }
  .section-head a:hover { color: var(--ink); }
  .subjects { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; margin-top: 14px; }
  .subject .pct { font-size: 26px; font-weight: 700; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
  .subject .pct small { font-size: 13px; font-weight: 500; color: var(--ink-3); margin-left: 2px; }
  .subject .weak { font-size: 12.5px; color: var(--ink-2); }
  .subject .weak b { font-weight: 600; color: var(--c); }

  /* 스크롤 등장: 아래에서 위로 떠오름. --d 로 시간차 */
  .reveal {
    opacity: 0; transform: translateY(32px);
    transition: opacity .8s cubic-bezier(.16,1,.3,1), transform .8s cubic-bezier(.16,1,.3,1);
    transition-delay: var(--d, 0ms);
  }
  .reveal.in { opacity: 1; transform: none; }

  .hidden { display: none !important; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
    .reveal { opacity: 1; transform: none; }
  }

  /* ---------- 반응형 ---------- */
  @media (max-width: 960px) {
    .actions { grid-template-columns: repeat(4, 1fr); row-gap: 14px; margin-top: 64px; }
    .search { display: none; }
    .today { grid-template-columns: 1fr 1fr; }
    .today .todo { grid-column: 1 / -1; grid-row: 1; }
    .activity-body { flex-direction: column; align-items: stretch; gap: 18px; }
  }
  @media (max-width: 760px) {
    .app { padding: 8px; gap: 0; }
    .content { --edge: 8px; }
    .sidebar { position: fixed; z-index: 10; top: 8px; bottom: 8px; left: 8px; background: rgba(255,255,255,.8); }
    .app:not(.mobile-open) .sidebar { margin-left: calc(-1 * var(--sidebar-w) - 16px); opacity: 0; }
    .app.mobile-open .sidebar { margin-left: 0; opacity: 1; }
    .topbar .pill-btn { display: none; }
    .wrap { padding: 0 12px; }
    .chip .chip-text { display: none; }
    .today { margin-top: 40px; }
    .week-stats { grid-template-columns: repeat(3, 1fr); gap: 6px 12px; }
    .wstat .v { font-size: 19px; }
  }
  @media (max-width: 480px) {
    .today { grid-template-columns: 1fr; }
    .legend { display: none; }
  }
</style>
<link rel="stylesheet" href="glass.css" />
</head>
<body>
<canvas id="dots" aria-hidden="true"></canvas>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="ring-grad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4fc3ff" /><stop offset=".5" stop-color="#6b7cff" /><stop offset="1" stop-color="#c06bff" /></linearGradient>
</defs></svg>

<div class="app" id="app">
  <!-- ===================== 사이드바 ===================== -->
  <aside class="sidebar glass">
    <div class="brand">
      <span class="brand-company">Horcrux Technologies</span>
      <span class="brand-divider" aria-hidden="true"></span>
      <span class="brand-name">Eureka</span>
    </div>

    <a class="nav-item" href="#/" data-key="home"><i data-lucide="house"></i><span class="label">홈</span></a>
    <a class="nav-item" href="#/" id="nav-new"><i data-lucide="square-pen"></i><span class="label">새 학습</span></a>
    <button class="nav-item" id="nav-search" title="검색 (Ctrl+K · ⌘K)"><i data-lucide="search"></i><span class="label">검색</span></button>
    <a class="nav-item" href="#/notes" data-key="notes"><i data-lucide="circle-x"></i><span class="label">오답노트</span><span class="badge" id="notes-badge" hidden></span></a>
    <a class="nav-item" href="#/library" data-key="library"><i data-lucide="library"></i><span class="label">라이브러리</span></a>
    <a class="nav-item" href="#/interview" data-key="interview"><i data-lucide="mic"></i><span class="label">AI 면접</span></a>

    <div class="nav-scroll">
      <div class="section-title">프로젝트 <button id="new-project" title="새 프로젝트" aria-label="새 프로젝트"><i data-lucide="plus"></i></button></div>
      <div id="projects"></div>

      <div class="section-title">최근</div>
      <div id="chats"></div>
    </div>

    <div class="profile soft" id="profile" role="button" tabindex="0" aria-label="프로필 메뉴">
      <div class="avatar" id="profile-avatar"></div>
      <div class="who"><span id="profile-name"></span><small id="profile-sub"></small></div>
      <span class="icon-btn" aria-hidden="true"><i data-lucide="settings"></i></span>
    </div>
  </aside>

  <!-- ===================== 메인 ===================== -->
  <main class="main">
    <header class="topbar">
      <button class="icon-btn" id="toggle" title="사이드바"><i data-lucide="panel-left"></i></button>
      <label class="search soft">
        <i data-lucide="search"></i>
        <input placeholder="대화, 문제, 개념 검색" />
      </label>
      <button class="pill-btn soft" id="feedback-btn">피드백</button>
      <button class="icon-btn soft" id="notify-btn" title="알림"><i data-lucide="bell"></i><span class="dot" hidden></span></button>
    </header>

    <div class="content">
      <div class="wrap">
        <div id="home">
        <section class="hero">
          <h1 id="greeting">오늘은 무엇을 공부할까요?</h1>
          <p>문제 생성부터 오답 분석, 개념 정리까지 한 번에</p>

          <form class="composer glass" id="composer">
            <button type="button" class="icon-btn" data-attach title="사진·파일 첨부" aria-label="사진·파일 첨부"><i data-lucide="plus"></i></button>
            <button type="button" class="chip" id="project-chip" title="어느 프로젝트에서 공부할지 고르기"></button>
            <textarea id="prompt" class="cin" rows="1" maxlength="2000" placeholder="미적분 치환적분 3점짜리 5문제 내줘" aria-label="질문"></textarea>
            <span class="voice-meter" hidden aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
            <button type="button" class="icon-btn mic-btn" data-mic title="음성 입력" aria-label="음성 입력"><i data-lucide="mic"></i></button>
            <button type="submit" class="send" id="send" disabled><i data-lucide="arrow-up"></i></button>
          </form>
        </section>

        <section class="actions" id="actions"></section>

        <!-- 오늘: 목표 · 할 일 · 다가오는 시험 -->
        <section class="onboard panel" id="onboard" hidden aria-label="시작 안내"></section>
        <section class="today" aria-label="오늘">
          <article class="panel goal" id="goal-card"></article>
          <article class="panel todo">
            <div class="panel-head"><h2>오늘 할 일</h2><span class="muted" id="todo-count"></span></div>
            <div class="todo-list" id="todo"></div>
          </article>
          <article class="panel exam" id="exam-card"></article>
        </section>

        <!-- 학습 기록: 최근 20주 히트맵 + 이번 주 요약 -->
        <section class="panel activity" aria-label="학습 기록">
          <div class="panel-head">
            <h2>학습 기록</h2>
            <span class="legend" aria-hidden="true">적음 <i class="l0"></i><i class="l1"></i><i class="l2"></i><i class="l3"></i><i class="l4"></i> 목표 달성</span>
          </div>
          <div class="activity-body">
            <div class="heat-scroll" id="heat-scroll"><div class="heat" id="heat"></div></div>
            <div class="week-stats" id="week-stats"></div>
          </div>
        </section>

        <div class="section-head">
          <h2>최근 학습</h2>
          <a href="#/library">라이브러리</a>
        </div>
        <section class="cards" id="cards-recent"></section>

        <div class="section-head">
          <h2>과목별 학습 현황</h2>
          <a href="#/notes">오답노트 보기</a>
        </div>
        <section class="subjects" id="subjects"></section>
        </div>
        <div id="view" hidden></div>
      </div>
    </div>
  </main>
</div>

<script src="concepts.js"></script>
<script src="store.js"></script>
<script src="app.js"></script>
<script src="visit.js"></script>
</body>
</html>
