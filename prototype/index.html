<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Eureka</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
<!-- Horcrux Technologies 로고 폰트 (회사 웹사이트 --font-heading 과 동일) -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&display=swap" />
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script src="dots.js"></script>
<style>
  :root {
    --bg: #f7f8fb;
    --ink: #0f172a;
    --ink-2: #475569;
    --ink-3: #6b7280; /* 흰 배경 대비 4.8:1 (AA) */
    --line: rgba(15, 23, 42, 0.08);
    --accent: #4f6bff;
    --accent-soft: rgba(79, 107, 255, 0.1);
    --warn: #f97316;

    /* 과목 색 — 무지개 스펙트럼에서 추출, 과목 표시에만 사용 */
    --math: #3b82f6;
    --physics: #8b5cf6;
    --chemistry: #14b8a6;
    --biology: #22c55e;
    --earth: #f59e0b;

    --rainbow: conic-gradient(from 0deg, #ff5f6d, #ffb347, #ffe259, #5ee7a0, #4fc3ff, #6b7cff, #c06bff, #ff5f6d);

    /* Liquid Glass — Clear (내비게이션 층에만) */
    --glass: rgba(255, 255, 255, 0.42);
    --glass-strong: rgba(255, 255, 255, 0.7);
    --glass-hover: rgba(255, 255, 255, 0.6);
    --glass-blur: blur(24px) saturate(170%);
    --glass-shadow: 0 8px 32px rgba(31, 41, 80, 0.07);
    --surface: rgba(255, 255, 255, 0.92);

    --radius-lg: 20px;
    --sidebar-w: 256px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    color: var(--ink);
    background: var(--bg);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  input { font: inherit; color: inherit; }
  [data-lucide] { width: 16px; height: 16px; stroke-width: 1.6; flex-shrink: 0; }

  /* ---------- 무지개 도트 배경 ---------- */
  #dots { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }

  /* 유리: 위는 밝고 아래는 흐린 그라디언트 테두리로 빛이 맺힌 느낌 */
  .glass {
    position: relative;
    background: var(--glass);
    backdrop-filter: var(--glass-blur);
    -webkit-backdrop-filter: var(--glass-blur);
    box-shadow: var(--glass-shadow), inset 0 1px 0 rgba(255, 255, 255, 0.85);
  }
  .glass::before {
    content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px; pointer-events: none;
    background: linear-gradient(180deg, rgba(255,255,255,.95), rgba(255,255,255,.35) 40%, rgba(15,23,42,.06));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude;
  }

  .app { position: relative; z-index: 1; display: flex; height: 100vh; padding: 12px; gap: 12px; }

  /* ---------- 사이드바 ---------- */
  .sidebar {
    width: var(--sidebar-w); flex-shrink: 0;
    border-radius: var(--radius-lg);
    display: flex; flex-direction: column;
    padding: 16px 10px 10px;
    transition: margin-left .35s cubic-bezier(.2,.8,.2,1), opacity .25s;
  }
  .app.collapsed .sidebar { margin-left: calc(-1 * var(--sidebar-w) - 12px); opacity: 0; }

  /* 회사 로고명 | 서비스명 */
  .brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 18px; white-space: nowrap; }
  .brand-company { font-family: "Space Grotesk", sans-serif; font-weight: 700; font-size: 14px; letter-spacing: -0.025em; color: var(--ink); }
  .brand-divider { width: 1px; height: 14px; background: rgba(15, 23, 42, 0.18); }
  .brand-name { font-weight: 700; font-size: 17px; letter-spacing: -0.02em; }

  .nav-item {
    display: flex; align-items: center; gap: 10px;
    width: 100%; padding: 9px 10px; border-radius: 10px;
    font-size: 14px; line-height: 18px; color: var(--ink); text-align: left;
    transition: background .15s;
  }
  .nav-item:hover { background: var(--glass-hover); }
  .nav-item.active {
    background: rgba(255, 255, 255, 0.78); font-weight: 600;
    box-shadow: inset 0 1px 0 #fff, inset 0 0 0 1px rgba(255,255,255,.6), 0 1px 2px rgba(15,23,42,.04), 0 4px 14px rgba(15,23,42,.05);
  }
  .nav-item [data-lucide] { color: var(--ink-2); }
  .nav-item .label { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .badge {
    font-size: 11px; font-weight: 700; color: #fff; background: var(--warn);
    min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px;
    display: grid; place-items: center;
  }
  .dday { font-size: 11px; font-weight: 600; color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .dday.soon { color: var(--warn); }

  /* 목록이 스크롤될 때 위아래 끝이 페이드 아웃 */
  .nav-scroll {
    flex: 1; overflow-y: auto; margin: 0 -4px; padding: 0 4px 16px; scrollbar-width: none;
    -webkit-mask-image: linear-gradient(180deg, transparent 0, #000 14px, #000 calc(100% - 28px), transparent 100%);
    mask-image: linear-gradient(180deg, transparent 0, #000 14px, #000 calc(100% - 28px), transparent 100%);
  }
  .nav-scroll::-webkit-scrollbar { display: none; }
  .section-title {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 13px; font-weight: 500; color: var(--ink-3);
    padding: 16px 10px 6px;
  }
  .section-title button { color: var(--ink-3); padding: 2px; border-radius: 6px; display: grid; }
  .section-title button:hover { color: var(--ink); background: var(--glass-hover); }
  .nav-item.chat { font-size: 13.5px; color: var(--ink-2); padding: 7px 10px; }
  .nav-item.chat:hover { color: var(--ink); }

  .profile {
    display: flex; align-items: center; gap: 10px;
    margin-top: 4px; padding: 8px 6px 8px 10px; border-radius: 14px;
  }
  .avatar {
    width: 28px; height: 28px; border-radius: 50%; background: var(--rainbow);
    display: grid; place-items: center; font-size: 12px; font-weight: 700; color: #fff;
    text-shadow: 0 1px 2px rgba(0,0,0,.25);
  }
  .profile .who { flex: 1; min-width: 0; font-size: 13px; line-height: 1.3; }
  .profile .who small { display: block; color: var(--ink-3); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ---------- 메인 ---------- */
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative; }

  /* 상단바: 콘텐츠 위에 떠 있고, 뒤의 흐림 띠가 아래로 갈수록 투명해져 경계 없이 사라진다 */
  .topbar {
    position: absolute; top: 0; left: 0; right: 0; z-index: 5;
    display: flex; align-items: center; gap: 8px; padding: 0 4px 0 2px; height: 48px;
  }
  .topbar::before {
    content: ""; position: absolute; left: -12px; right: -12px; top: -12px; bottom: -28px; z-index: -1;
    background: linear-gradient(180deg, var(--bg) 0%, rgba(247, 248, 251, 0.82) 45%, rgba(247, 248, 251, 0) 100%);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    -webkit-mask-image: linear-gradient(180deg, #000 45%, transparent);
    mask-image: linear-gradient(180deg, #000 45%, transparent);
    opacity: .7; transition: opacity .3s;
  }
  .topbar.scrolled::before { opacity: 1; }

  .icon-btn { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 9px; transition: background .15s; position: relative; }
  .icon-btn:hover { background: rgba(15,23,42,.05); }

  /* 검색·버튼: 테두리 없는 유리 알약 */
  .soft {
    background: rgba(255, 255, 255, 0.55);
    backdrop-filter: blur(16px) saturate(160%); -webkit-backdrop-filter: blur(16px) saturate(160%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.9), inset 0 0 0 1px rgba(255,255,255,.5), 0 1px 2px rgba(15,23,42,.04), 0 4px 14px rgba(15,23,42,.04);
    transition: background .25s, box-shadow .25s, width .35s cubic-bezier(.16,1,.3,1);
  }
  .soft:hover { background: rgba(255, 255, 255, 0.75); }
  .search {
    margin: 0 auto; width: min(280px, 30vw); height: 34px;
    display: flex; align-items: center; gap: 8px;
    padding: 0 10px 0 13px; border-radius: 999px;
    color: var(--ink-3); font-size: 13.5px; cursor: text;
  }
  .search:focus-within {
    width: min(380px, 40vw); background: rgba(255,255,255,.92);
    box-shadow: inset 0 1px 0 #fff, 0 0 0 4px var(--accent-soft), 0 8px 24px rgba(15,23,42,.08);
  }
  .search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--ink); }
  .search input::placeholder { color: var(--ink-3); transition: opacity .2s; }
  .search:focus-within input::placeholder { opacity: .6; }
  .search .keys { display: flex; gap: 3px; transition: opacity .2s; }
  .search:focus-within .keys { opacity: 0; }
  kbd { font-family: inherit; font-size: 10.5px; color: var(--ink-3); min-width: 18px; height: 18px; display: grid; place-items: center; border-radius: 5px; background: rgba(15,23,42,.05); }
  .pill-btn { height: 34px; padding: 0 14px; border-radius: 999px; font-size: 13.5px; font-weight: 500; }
  .topbar .icon-btn.soft { width: 34px; height: 34px; border-radius: 50%; }
  .dot { position: absolute; top: 7px; right: 8px; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); border: 1.5px solid #fff; }

  .content { flex: 1; overflow-y: auto; padding: 48px 4px 40px; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 20px; }

  .hero { text-align: center; padding: 11vh 0 0; }
  .hero h1 { font-size: clamp(24px, 2.4vw, 30px); font-weight: 600; letter-spacing: -0.025em; }
  .hero p { color: var(--ink-2); margin-top: 8px; font-size: 14px; }

  /* 입력창 = 화면의 주인공 */
  .composer {
    margin: 24px auto 0; max-width: 650px;
    border-radius: 28px; padding: 7px 7px 7px 10px;
    display: flex; align-items: center; gap: 6px;
    background: rgba(255,255,255,.55);
    box-shadow: 0 12px 40px rgba(31,41,80,.1), inset 0 1px 0 #fff;
  }
  .composer input { flex: 1; border: 0; outline: 0; background: transparent; font-size: 15px; padding: 8px 4px; min-width: 0; }
  .composer input::placeholder { color: var(--ink-3); }
  .composer .icon-btn:hover { background: rgba(255,255,255,.7); }
  .chip {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 4px 9px; border-radius: 999px; font-size: 12.5px; font-weight: 600;
    background: color-mix(in srgb, var(--c, var(--accent)) 12%, transparent); color: var(--c, var(--accent)); white-space: nowrap;
  }
  .chip [data-lucide] { width: 13px; height: 13px; }
  .send {
    width: 36px; height: 36px; border-radius: 50%;
    background: var(--ink); color: #fff; display: grid; place-items: center;
    transition: transform .15s, opacity .15s, box-shadow .3s;
  }
  .send:disabled { opacity: .2; cursor: default; }
  .send:not(:disabled) { box-shadow: 0 0 0 3px #fff, 0 0 0 5px transparent; }
  .send:not(:disabled):hover { transform: scale(1.05); }

  .actions { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; max-width: 780px; margin: 120px auto 0; }
  .action { display: flex; flex-direction: column; align-items: center; gap: 11px; padding: 6px 0; border-radius: 14px; font-size: 14px; font-weight: 500; }
  .action .tile {
    width: 42px; height: 42px; border-radius: 11px; display: grid; place-items: center;
    border: 1px solid transparent;
    background: linear-gradient(#fff, #fff) padding-box, linear-gradient(var(--line), var(--line)) border-box;
    box-shadow: 0 1px 3px rgba(15,23,42,.05);
    transition: transform .2s, background .2s;
  }
  .action .tile [data-lucide] { width: 17px; height: 17px; }
  /* 호버 시 무지개 테두리 */
  .action:hover .tile { transform: translateY(-3px); background: linear-gradient(#fff, #fff) padding-box, var(--rainbow) border-box; }

  /* 배너: 클리어 화이트 유리 + 양옆 무지개 도트 */
  .banner {
    margin-top: 44px; border-radius: 18px; min-height: 190px;
    overflow: hidden; text-align: center;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    padding: 32px 28px; background: rgba(255, 255, 255, 0.6);
  }
  .banner canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .banner > div { position: relative; z-index: 1; }
  .banner .eyebrow { font-size: 12.5px; font-weight: 500; color: var(--ink-3); }
  .banner h2 { font-size: 22px; font-weight: 600; letter-spacing: -0.02em; margin-top: 6px; }
  .banner p { margin-top: 4px; font-size: 13.5px; color: var(--ink-2); }
  .banner .cta { display: flex; gap: 6px; }
  .btn-primary { background: var(--ink); color: #fff; height: 32px; padding: 0 13px; border-radius: 9px; font-weight: 500; font-size: 14px; }
  .btn-primary:hover { background: #1e293b; }
  .btn-ghost { height: 32px; padding: 0 13px; border-radius: 9px; font-weight: 500; font-size: 14px; background: rgba(255,255,255,.7); border: 1px solid var(--line); }
  .btn-ghost:hover { background: #fff; }

  .tabs { display: flex; gap: 4px; margin-top: 36px; }
  .tab { height: 30px; padding: 0 12px; border-radius: 9px; font-size: 14px; color: var(--ink-2); font-weight: 500; }
  .tab.active { color: var(--ink); background: #fff; border: 1px solid var(--line); box-shadow: 0 1px 3px rgba(15,23,42,.05); }

  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; margin-top: 16px; }
  .card {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 14px; padding: 16px; text-align: left;
    box-shadow: 0 2px 10px rgba(31,41,80,.04);
    transition: transform .2s, box-shadow .2s;
    display: flex; flex-direction: column; gap: 8px;
  }
  .card:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(31,41,80,.08); }
  .card .kind { font-size: 12px; color: var(--ink-3); display: flex; align-items: center; gap: 6px; }
  .card .kind .sw { width: 7px; height: 7px; border-radius: 50%; background: var(--c, var(--ink-3)); }
  .card h3 { font-size: 14.5px; font-weight: 600; letter-spacing: -0.01em; }
  .card .meta { font-size: 12.5px; color: var(--ink-2); }
  .bar { height: 5px; border-radius: 3px; background: rgba(15,23,42,.06); overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 3px; background: var(--c, var(--accent)); }

  .section-head { display: flex; align-items: baseline; justify-content: space-between; margin-top: 44px; }
  .section-head h2 { font-size: 16px; font-weight: 600; letter-spacing: -0.01em; }
  .section-head a { font-size: 13px; color: var(--ink-3); text-decoration: none; }
  .section-head a:hover { color: var(--ink); }
  .subjects { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; margin-top: 14px; }
  .subject .pct { font-size: 26px; font-weight: 700; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
  .subject .pct small { font-size: 13px; font-weight: 500; color: var(--ink-3); margin-left: 2px; }
  .subject .weak { font-size: 12.5px; color: var(--ink-2); }
  .subject .weak b { font-weight: 600; color: var(--c); }

  /* 스크롤 등장: 아래에서 위로 떠오름. --d 로 시간차 */
  .reveal {
    opacity: 0; transform: translateY(32px);
    transition: opacity .8s cubic-bezier(.16,1,.3,1), transform .8s cubic-bezier(.16,1,.3,1);
    transition-delay: var(--d, 0ms);
  }
  .reveal.in { opacity: 1; transform: none; }

  .hidden { display: none !important; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
    .reveal { opacity: 1; transform: none; }
  }

  /* ---------- 반응형 ---------- */
  @media (max-width: 960px) {
    .actions { grid-template-columns: repeat(4, 1fr); row-gap: 14px; margin-top: 64px; }
    .search { display: none; }
    .banner { padding: 26px 20px; }
  }
  @media (max-width: 760px) {
    .app { padding: 8px; gap: 0; }
    .sidebar { position: fixed; z-index: 10; top: 8px; bottom: 8px; left: 8px; background: rgba(255,255,255,.8); }
    .app:not(.mobile-open) .sidebar { margin-left: calc(-1 * var(--sidebar-w) - 16px); opacity: 0; }
    .app.mobile-open .sidebar { margin-left: 0; opacity: 1; }
    .topbar .pill-btn { display: none; }
    .wrap { padding: 0 12px; }
    .chip .chip-text { display: none; }
  }
</style>
</head>
<body>
<canvas id="dots" aria-hidden="true"></canvas>

<div class="app" id="app">
  <!-- ===================== 사이드바 ===================== -->
  <aside class="sidebar glass">
    <div class="brand">
      <span class="brand-company">Horcrux Technologies</span>
      <span class="brand-divider" aria-hidden="true"></span>
      <span class="brand-name">Eureka</span>
    </div>

    <button class="nav-item active" data-nav><i data-lucide="square-pen"></i><span class="label">새 학습</span></button>
    <button class="nav-item" data-nav><i data-lucide="search"></i><span class="label">검색</span></button>
    <button class="nav-item" data-nav><i data-lucide="circle-x"></i><span class="label">오답노트</span><span class="badge">3</span></button>
    <button class="nav-item" data-nav><i data-lucide="library"></i><span class="label">라이브러리</span></button>

    <div class="nav-scroll">
      <div class="section-title">프로젝트 <button title="새 프로젝트"><i data-lucide="plus"></i></button></div>
      <div id="projects"></div>

      <div class="section-title">최근</div>
      <div id="chats"></div>
    </div>

    <div class="profile soft">
      <div class="avatar">민</div>
      <div class="who">민석<small>오늘 12 / 20문제 · 🔥 7일 연속</small></div>
      <button class="icon-btn" title="설정"><i data-lucide="settings"></i></button>
    </div>
  </aside>

  <!-- ===================== 메인 ===================== -->
  <main class="main">
    <header class="topbar">
      <button class="icon-btn" id="toggle" title="사이드바"><i data-lucide="panel-left"></i></button>
      <label class="search soft">
        <i data-lucide="search"></i>
        <input placeholder="대화, 문제, 개념 검색" />
        <span class="keys"><kbd>⌘</kbd><kbd>K</kbd></span>
      </label>
      <button class="pill-btn soft">피드백</button>
      <button class="icon-btn soft" title="알림"><i data-lucide="bell"></i><span class="dot"></span></button>
    </header>

    <div class="content">
      <div class="wrap">
        <section class="hero">
          <h1>오늘은 무엇을 공부할까요?</h1>
          <p>문제 생성부터 오답 분석, 개념 정리까지 한 번에</p>

          <form class="composer glass" id="composer">
            <button type="button" class="icon-btn" title="자료 첨부"><i data-lucide="plus"></i></button>
            <span class="chip" style="--c: var(--math)" title="프로젝트"><i data-lucide="folder"></i><span class="chip-text">2027 수능 미적분</span></span>
            <input id="prompt" placeholder="미적분 치환적분 3점짜리 5문제 내줘" autocomplete="off" />
            <button type="button" class="icon-btn" title="음성 입력"><i data-lucide="mic"></i></button>
            <button type="submit" class="send" id="send" disabled><i data-lucide="arrow-up"></i></button>
          </form>
        </section>

        <section class="actions" id="actions"></section>

        <section class="banner glass">
          <canvas id="banner-dots" aria-hidden="true"></canvas>
          <div>
            <div class="eyebrow">이번 주 약점 · 2027 수능 미적분</div>
            <h2>정적분으로 정의된 함수</h2>
            <p>최근 8문제 중 5문제 오답 · 주로 "미분하기 전 상수항 처리"에서 실수했어요</p>
          </div>
          <div class="cta">
            <button class="btn-primary">복습 시작</button>
            <button class="btn-ghost">개념 보기</button>
          </div>
        </section>

        <div class="tabs">
          <button class="tab active" data-tab="recent">최근 학습</button>
          <button class="tab" data-tab="recommend">추천 학습</button>
        </div>
        <section class="cards" id="cards-recent"></section>
        <section class="cards hidden" id="cards-recommend"></section>

        <div class="section-head">
          <h2>과목별 학습 현황</h2>
          <a href="#">전체 보기</a>
        </div>
        <section class="subjects" id="subjects"></section>
      </div>
    </div>
  </main>
</div>

<script>
  // ---------- 목업 데이터 (추후 API 연동) ----------
  const SUBJECT = { math: "var(--math)", physics: "var(--physics)", chemistry: "var(--chemistry)", biology: "var(--biology)", earth: "var(--earth)" };
  const projects = [
    { name: "2027 수능 미적분", dday: 24, subject: "math" },
    { name: "화학I 중간고사", dday: 12, subject: "chemistry" },
    { name: "물리 역학 기초 다지기", dday: null, subject: "physics" },
  ];
  const chats = [
    "치환적분 변형 문제 5개",
    "중화반응 왜 틀렸는지",
    "로그 성질 개념 정리",
    "6월 모의고사 약점 분석",
    "H-R도 암기 카드 만들기",
    "등가속도 운동 그래프 문제",
  ];
  const actions = [
    ["pencil-line", "문제 풀기", "미적분 3점짜리 5문제 내줘"],
    ["circle-x", "오답노트", "최근 틀린 문제로 변형 문제 만들어줘"],
    ["chart-no-axes-column", "약점 분석", "이번 주 내 약점 분석해줘"],
    ["book-open", "개념 정리", "정적분으로 정의된 함수 개념 정리해줘"],
    ["layers", "암기 카드", "화학I 주기적 성질 암기 카드 만들어줘"],
    ["scroll-text", "기출 스타일", "6월 모평 스타일로 4점짜리 3문제"],
    ["timer", "모의고사", "미적분 30문항 모의고사 시작"],
    ["ellipsis", "더보기", ""],
  ];
  const recent = [
    { subject: "math", kind: "2027 수능 미적분", title: "치환적분 변형 문제 5개", meta: "4 / 5 정답 · 2시간 전", pct: 80 },
    { subject: "chemistry", kind: "화학I 중간고사", title: "중화반응 오답 분석", meta: "원인: 몰 농도 계산 · 어제", pct: 45 },
    { subject: "math", kind: "대화", title: "로그 성질 개념 정리", meta: "암기 카드 12장 생성 · 2일 전", pct: 100 },
    { subject: "earth", kind: "대화", title: "H-R도 암기 카드", meta: "20장 중 14장 외움 · 3일 전", pct: 70 },
  ];
  const recommend = [
    { subject: "math", kind: "약점 보완", title: "정적분으로 정의된 함수 집중 10문제", meta: "예상 20분 · 난이도 ★★★", pct: 0 },
    { subject: "chemistry", kind: "복습 타이밍", title: "3일 전 틀린 문제 다시 풀기", meta: "잊기 전에 복습하면 기억이 오래가요", pct: 0 },
    { subject: "physics", kind: "개념", title: "운동량 보존 핵심 정리", meta: "예상 8분", pct: 0 },
  ];

  const $ = (s) => document.querySelector(s);

  $("#projects").innerHTML = projects.map((p) => `
    <button class="nav-item" data-nav>
      <i data-lucide="folder" style="color:${SUBJECT[p.subject]}"></i><span class="label">${p.name}</span>
      ${p.dday != null ? `<span class="dday ${p.dday <= 14 ? "soon" : ""}">D-${p.dday}</span>` : ""}
    </button>`).join("");

  $("#chats").innerHTML = chats.map((c) => `
    <button class="nav-item chat" data-nav><span class="label">${c}</span></button>`).join("");

  $("#actions").innerHTML = actions.map(([icon, label, prompt]) => `
    <button class="action" data-prompt="${prompt}">
      <span class="tile"><i data-lucide="${icon}"></i></span>${label}
    </button>`).join("");

  const card = (c) => `
    <button class="card" style="--c:${SUBJECT[c.subject]}">
      <span class="kind"><span class="sw"></span>${c.kind}</span>
      <h3>${c.title}</h3>
      <div class="meta">${c.meta}</div>
      ${c.pct ? `<div class="bar"><i style="width:${c.pct}%"></i></div>` : ""}
    </button>`;
  $("#cards-recent").innerHTML = recent.map(card).join("");
  $("#cards-recommend").innerHTML = recommend.map(card).join("");

  const subjects = [
    { subject: "math", name: "수학 · 미적분", pct: 64, weak: "정적분으로 정의된 함수" },
    { subject: "physics", name: "물리학I", pct: 71, weak: "운동량 보존" },
    { subject: "chemistry", name: "화학I", pct: 49, weak: "중화 반응 양적 관계" },
    { subject: "biology", name: "생명과학I", pct: 82, weak: "가계도 분석" },
    { subject: "earth", name: "지구과학I", pct: 58, weak: "H-R도" },
  ];
  $("#subjects").innerHTML = subjects.map((s) => `
    <button class="card subject" style="--c:${SUBJECT[s.subject]}">
      <span class="kind"><span class="sw"></span>${s.name}</span>
      <div class="pct">${s.pct}<small>% 정답률</small></div>
      <div class="bar"><i style="width:${s.pct}%"></i></div>
      <div class="weak">약점 <b>${s.weak}</b></div>
    </button>`).join("");

  lucide.createIcons();

  const composerEl = $("#composer");
  const contentEl = $(".content");
  contentEl.addEventListener("scroll", () => $(".topbar").classList.toggle("scrolled", contentEl.scrollTop > 4), { passive: true });

  // ---------- 스크롤 등장 (위로 촤라락) ----------
  // 그룹 안의 요소는 순서대로 시간차를 두고 떠오른다.
  const revealGroups = [
    [".hero h1", ".hero p", ".hero .composer"],
    [".action"],
    [".banner"],
    [".tabs"],
    ["#cards-recent .card"],
    ["#cards-recommend .card"],
    [".section-head"],
    [".subject"],
  ];
  revealGroups.forEach((group) => {
    const els = group.flatMap((s) => [...document.querySelectorAll(s)]);
    els.forEach((el, i) => { el.classList.add("reveal"); el.style.setProperty("--d", `${i * 70}ms`); });
  });
  const revealer = new IntersectionObserver((entries) => {
    for (const e of entries) {
      if (!e.isIntersecting) continue;
      e.target.classList.add("in");
      revealer.unobserve(e.target);
    }
  }, { root: contentEl, threshold: 0.12, rootMargin: "0px 0px -6% 0px" });
  document.querySelectorAll(".reveal").forEach((el) => revealer.observe(el));
  const textEls = [".hero h1", ".hero p", ...[...document.querySelectorAll(".action")].map((_, i) => `.action:nth-child(${i + 1})`)]
    .map((s) => document.querySelector(s));
  dotField($("#dots"), {
    gap: 18, baseR: 1, peakR: 2.4, baseAlpha: 0.1, peakAlpha: 0.55, light: 60,
    wavelength: 90, speed: 1.1, hueSpeed: 25, reach: 0.62, introSec: 1.3,
    focus: () => {
      const r = composerEl.getBoundingClientRect();
      return [r.left + r.width / 2, r.top + r.height / 2];
    },
    clear: () => textEls.map((el) => el.getBoundingClientRect()),
    scrollY: () => contentEl.scrollTop,
  });
  dotField($("#banner-dots"), {
    gap: 12, baseR: 0.8, peakR: 2, baseAlpha: 0.12, peakAlpha: 0.75, light: 58,
    wavelength: 60, speed: 1.4, hueSpeed: 40, introSec: 1.8, edges: true,
    focus: (W, H) => [W / 2, H / 2],
  });

  // ---------- 상호작용 ----------
  document.querySelectorAll("[data-nav]").forEach((el) =>
    el.addEventListener("click", () => {
      document.querySelectorAll("[data-nav]").forEach((n) => n.classList.remove("active"));
      el.classList.add("active");
      $("#app").classList.remove("mobile-open");
    })
  );

  $("#toggle").addEventListener("click", () => {
    const app = $("#app");
    if (matchMedia("(max-width: 760px)").matches) app.classList.toggle("mobile-open");
    else app.classList.toggle("collapsed");
  });

  const prompt = $("#prompt"), send = $("#send");
  prompt.addEventListener("input", () => (send.disabled = !prompt.value.trim()));
  document.querySelectorAll("[data-prompt]").forEach((el) =>
    el.addEventListener("click", () => {
      if (!el.dataset.prompt) return;
      prompt.value = el.dataset.prompt;
      send.disabled = false;
      prompt.focus();
    })
  );
  composerEl.addEventListener("submit", (e) => {
    e.preventDefault();
    alert(`(프로토타입) 요청: ${prompt.value}`);
  });

  document.querySelectorAll("[data-tab]").forEach((t) =>
    t.addEventListener("click", () => {
      document.querySelectorAll("[data-tab]").forEach((x) => x.classList.toggle("active", x === t));
      $("#cards-recent").classList.toggle("hidden", t.dataset.tab !== "recent");
      $("#cards-recommend").classList.toggle("hidden", t.dataset.tab !== "recommend");
    })
  );

  document.addEventListener("keydown", (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key === "k") { e.preventDefault(); document.querySelector(".search input")?.focus(); }
  });
</script>
</body>
</html>
