[project]
name = "education"
version = "0.1.0"
description = "시험 대비 교육용 AI Agent (가칭 Education) — MVP: 수학 + 과학"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/education"]

[tool.pytest.ini_options]
testpaths = ["tests"]
